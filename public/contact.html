<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mensaje Enviado | Printer Computers & Systems</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(to bottom, #1d4ed8, #3b82f6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2937;
    }

    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      animation: fadeIn 0.4s ease-in-out;
    }

    /* Ícono de casa */
    .home-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 20px;
  font-size: 18px;
  text-decoration: none;
  color: #2563eb;
  background: #eff6ff;
  padding: 12px 20px;
  border-radius: 999px;
  transition: background 0.2s ease, transform 0.2s ease;
}

.home-icon:hover {
  background: #dbeafe;
  transform: scale(1.05);
}

    .card img {
      width: 80px;
      margin-bottom: 20px;
    }

    h1 {
      color: #1d4ed8;
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      font-size: 16px;
      color: #4b5563;
      margin-bottom: 25px;
    }

    a.button {
      display: inline-block;
      padding: 12px 24px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    a.button:hover {
      background: #1e40af;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    

    <!-- Logo opcional -->
    <img src="/images/logo.png" alt="Printer Computers & Systems">

    <h1>¡Gracias por contactarnos!</h1>
    <p>
      Hemos recibido tu mensaje correctamente.  
      Nuestro equipo se pondrá en contacto contigo a la brevedad.
    </p>

    <!-- Ícono de inicio -->
    <a href="/" class="home-icon" title="Volver al inicio">🏠</a>

</div>


</body>
</html>
